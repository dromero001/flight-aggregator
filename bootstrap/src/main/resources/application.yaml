# Each provider's base-url and api-key have no default: they come from the environment
# (PROVIDERS_ALPHA_BASEURL, PROVIDERS_ALPHA_APIKEY, ...), and startup fails without them.
spring:
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      # A request waits at most 1 s for a pooled connection, not Hikari's 30 s. With PostgreSQL out of
      # reach, a health probe pays this wait twice (Boot's db component and the inventory one each
      # read it), so it answers 503 DOWN in about 2 s, inside the 5 s compose gives its health check,
      # instead of a timeout after 60 s (plan 5's end-of-plan review, F-I1). One of the ten pooled
      # connections not free within 1 s means an overload that a longer wait would only pile up on.
      connection-timeout: 1000
      # Passed to the PostgreSQL driver on every connection, whatever the URL (compose sets only the
      # URL): a read that waits more than 120 s for the server fails instead of blocking a run for
      # ever, and TCP keepalive notices a server that is gone. Each store's transaction also bounds
      # its statements to 5 minutes (StatementTimeout).
      data-source-properties:
        socketTimeout: 120
        tcpKeepAlive: true
  data:
    redis:
      # Valkey (spec 6.2), at Boot's localhost:6379 unless the environment says otherwise. Q9: a
      # command waits 250 ms at most and a connection 1 s, instead of Lettuce's 60 s and 10 s, so a
      # Valkey outage costs a search little; ValkeyConfig rejects commands while disconnected.
      timeout: 250ms
      connect-timeout: 1s
  security:
    oauth2:
      resourceserver:
        jwt:
          # The application is a resource server (spec 6.6), configured as Spring Boot documents, so
          # that another identity provider is a change of these settings only. The keys come from
          # jwk-set-uri (compose sets the internal URL; nothing is fetched at startup), and each
          # token must name issuer-uri, the public one, fixed by KC_HOSTNAME. The defaults suit a
          # Keycloak published on localhost:8180 with the application run outside compose.
          jwk-set-uri: http://localhost:8180/realms/flight-aggregator/protocol/openid-connect/certs
          issuer-uri: http://localhost:8180/realms/flight-aggregator
          # Keycloak's realm roles, nested under realm_access.roles, become ROLE_<role>.
          authorities-claim-expressions: "[realm_access][roles]"
          authority-prefix: ROLE_

server:
  # The rate limit counts each client under its address (spec 6.6). Tomcat's RemoteIpValve takes it
  # from X-Forwarded-For only when the connection comes from one of its internal proxies (private
  # ranges and loopback, as the dashboard's nginx in compose), so a client cannot pick its own
  # counter by sending the header itself.
  forward-headers-strategy: native

springdoc:
  # The served contract, committed as docs/architecture/openapi.json, lists its keys in order, so the
  # same API is always the same text (OpenApiContractTest, spec 6.11).
  writer-with-order-by-keys: true

providers:
  # At most this many calls of one provider at once, origin downloads and quotes together (a run's
  # download is outside the limit); one more is rejected, not queued (Q9). Required: see
  # ProvidersProperties.
  concurrency-limit: 4

search:
  # A cached page lives less than the freshness threshold, so the cache never extends staleness
  # (spec 6.4). Required: see SearchProperties.
  cache-ttl: PT5M
  # A search on an origin refreshed longer ago than this asks for its background refresh (spec 6.4).
  freshness-threshold: PT10M
  # A refresh claim (SET NX) holds this long, longer than one refresh takes (Q9).
  refresh-claim-ttl: PT2M
  # After a Valkey command fails, Valkey is skipped this long, then one call probes it, so an outage
  # costs a search one command timeout, not one per command (plan 5, the user's decision of
  # 2026-11-15).
  valkey-skip: PT10S

ingestion:
  # A run that would build more itineraries publishes nothing (R7).
  max-itineraries: 2000000
  # IngestionJob runs at startup, then this long after each run ends (§6.4), on every instance
  # where the schedule is enabled; the ShedLock row lets one instance at a time run it.
  interval: PT30M
  schedule:
    enabled: true

logging:
  structured:
    format:
      # Boot's structured JSON (§6.10): the key-value pairs of a log event become fields.
      console: ecs

management:
  server:
    # Actuator's own port, reached only on compose's network, where Prometheus scrapes it with no
    # token; compose never publishes it (spec 6.6, the user's decision of 2026-11-15; plan 7, Q4).
    port: 8079
  tracing:
    sampling:
      # Every request and run is traced (plan 7, Q4): Boot samples 10% by default, so the run a
      # demo shows could go untraced, and a demo's volume is small.
      probability: 1.0
  otlp:
    metrics:
      export:
        # The OpenTelemetry starter brings an OTLP meter registry; metrics take one path, Prometheus's
        # scrape of the management port (spec 6.6), so nothing pushes them.
        enabled: false
  health:
    redis:
      # Valkey down makes search slower, not broken (spec 6.2), so Boot's indicator, which would
      # turn the whole health DOWN, is off; Valkey is reported as DEGRADED instead (plan 5, Q8).
      enabled: false
  endpoints:
    web:
      exposure:
        # On the management port only, open to Prometheus with no token (SecurityConfig, spec 6.6).
        include: health,metrics,prometheus
  endpoint:
    health:
      # The components behind the status are for an administrator only.
      show-details: when-authorized
      roles: ADMIN
      status:
        # A provider not up or Valkey down is DEGRADED (plan 5, Q8-A): worse than UP, better than
        # DOWN, which only PostgreSQL causes. Boot leaves out of the aggregate a status this list
        # does not name. DEGRADED answers 200 by Boot's default mapping (only DOWN and
        # OUT_OF_SERVICE are 503), so no http-mapping is set: one would replace those defaults.
        order: DOWN, OUT_OF_SERVICE, DEGRADED, UP, UNKNOWN
      group:
        # The health status on the API's own port, public (SecurityConfig), for compose's health
        # check and the orchestrator's probe. Boot takes only one segment there, hence /health and
        # not /actuator/health (plan 7, the user's decision of 2026-11-16). The group sets nothing
        # else: it holds every component and takes the details, roles, order and status codes above.
        api:
          additional-path: server:/health
