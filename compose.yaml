# Runs the whole stack with docker compose up --build: the three mock providers, PostgreSQL,
# Valkey, Keycloak, the aggregator, the dashboard (frontend) and the telemetry services
# (OpenTelemetry Collector, Prometheus, Tempo, Loki, Grafana). What each one is: README.md.
# The keys and the database password below are demo defaults, committed on purpose so that the
# project runs with that single command (spec 6.6). They protect only these local containers, whose
# ports are bound to the loopback interface. Override any of them from the shell or a .env file:
# ALPHA_API_KEY, BETA_API_KEY, GAMMA_API_KEY, POSTGRES_PASSWORD, ADMIN_SERVICE_CLIENT_SECRET,
# ADMIN_USER_PASSWORD. The last two are the secret of the admin-service client and the demo
# password of the realm's admin user, which the imported Keycloak realm
# (deploy/keycloak/flight-aggregator-realm.json) reads at import: committed on purpose so that a
# reviewer can call the admin endpoints without the author (README, "Admin access"). In
# production they would be secrets.
services:
  postgres:
    # Every service comes back after a crash or a Docker restart, until it is stopped on purpose.
    restart: unless-stopped
    image: postgres:18.4-trixie@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    environment:
      POSTGRES_DB: flightaggregator
      POSTGRES_USER: flightaggregator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-postgres-password}
    # Not published: only the app, on the compose network, reaches the database.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flightaggregator -d flightaggregator"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    restart: unless-stopped
    build:
      context: .
      dockerfile: bootstrap/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mock-gds:
        condition: service_healthy
      valkey:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # 512 MB of heap: the ingestion streams its ~1M itineraries into COPY, never holding them (R4).
      JAVA_TOOL_OPTIONS: -Xmx512m
      # The driver's socketTimeout (120 s) and tcpKeepAlive come from application.yaml, for any URL.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flightaggregator
      SPRING_DATASOURCE_USERNAME: flightaggregator
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-demo-postgres-password}
      PROVIDERS_ALPHA_BASEURL: http://mock-gds:8080
      PROVIDERS_ALPHA_APIKEY: ${ALPHA_API_KEY:-demo-alpha-key}
      PROVIDERS_BETA_BASEURL: http://mock-gds:8080
      PROVIDERS_BETA_APIKEY: ${BETA_API_KEY:-demo-beta-key}
      PROVIDERS_GAMMA_BASEURL: http://mock-gds:8080
      PROVIDERS_GAMMA_APIKEY: ${GAMMA_API_KEY:-demo-gamma-key}
      # The result cache, refresh claims and rate-limit counters (spec 6.2), on the compose network.
      SPRING_DATA_REDIS_HOST: valkey
      # The signatures are checked against Keycloak on the compose network; the issuer is its public
      # name (the issuer-uri of application.yaml stays http://localhost:8180/realms/flight-aggregator).
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8080/realms/flight-aggregator/protocol/openid-connect/certs
      # Traces go to the Collector on the compose network (spec 6.10). Nothing waits on it: an
      # export that fails is dropped (TelemetryUnavailableTest), so `app` does not depend on it.
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    healthcheck:
      # DEGRADED (a provider not up, or Valkey down) still searches, so it is healthy too (plan 5,
      # Q8-A); only DOWN, PostgreSQL out of reach, is not. The API port's public /health (plan 7,
      # the user's decision of 2026-11-16).
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/8080
          && printf 'GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          && grep -qE '"status":"(UP|DEGRADED)"' <&3
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  valkey:
    restart: unless-stopped
    # The image the Valkey tests run (ValkeyImage), by tag and multi-arch digest (spec 6.1).
    image: valkey/valkey:9.1.3-trixie@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    # A cache, not a store: bounded memory, the least recently used key evicted first (spec 6.2).
    command: ["valkey-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    # Not published: only the app, on the compose network, reaches it.
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  frontend:
    restart: unless-stopped
    build:
      context: frontend
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      # nginx serves the dashboard and proxies /api to the app, so the browser sees one origin.
      API_UPSTREAM: http://app:8080
      # Served as /config.json for the admin sign-in: the address a browser reaches Keycloak by.
      OIDC_AUTHORITY: http://localhost:8180/realms/flight-aggregator
      OIDC_CLIENT_ID: dashboard
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  keycloak:
    restart: unless-stopped
    image: quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
    command: ["start-dev", "--import-realm"]
    environment:
      # The issuer of every token: the address a browser reaches Keycloak by, not the one the app uses.
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
      # Read by the realm file's ${ADMIN_SERVICE_CLIENT_SECRET:...} and ${ADMIN_USER_PASSWORD:...}
      # placeholders at import.
      ADMIN_SERVICE_CLIENT_SECRET: ${ADMIN_SERVICE_CLIENT_SECRET:-demo-admin-service-secret}
      ADMIN_USER_PASSWORD: ${ADMIN_USER_PASSWORD:-demo-admin-password}
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./deploy/keycloak/flight-aggregator-realm.json:/opt/keycloak/data/import/flight-aggregator-realm.json:ro
    healthcheck:
      # The image has no curl: read the readiness answer of the management port over a TCP socket.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/9000
          && printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          && grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  mock-gds:
    restart: unless-stopped
    build:
      context: .
      dockerfile: mock-gds/Dockerfile
    ports:
      # Loopback only: the demo keys are public, so the mock is not published on the network.
      - "127.0.0.1:8081:8080"
    environment:
      MOCKGDS_PROVIDERS_ALPHA_APIKEY: ${ALPHA_API_KEY:-demo-alpha-key}
      MOCKGDS_PROVIDERS_BETA_APIKEY: ${BETA_API_KEY:-demo-beta-key}
      MOCKGDS_PROVIDERS_GAMMA_APIKEY: ${GAMMA_API_KEY:-demo-gamma-key}
    healthcheck:
      # The JRE image has no curl or wget: read the health response over a plain TCP socket with bash.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/8080
          && printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          && grep -q '"status":"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # The telemetry backends (spec 6.10), configured from deploy/. Their images are the ones the tests
  # run (ObservabilityImages). The app depends on none of them: telemetry is never in a request's path.
  # They keep their data on the container's own disk, Prometheus in memory, so `docker compose down`
  # resets it and leaves no volume behind (plan 7, Q4: no volumes).
  otel-collector:
    restart: unless-stopped
    image: otel/opentelemetry-collector:0.164.0@sha256:28b6d41ac51bff6b41ba5e8fe503569ffb9d6a1ea90f7a78419e86f34e44f750
    # Not published: only the app, on the compose network, sends it traces and logs.
    volumes:
      - ./deploy/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    # No health check, the one service without one (the user's decision of 2026-11-15): the core
    # image is /otelcol on scratch, with no shell, HTTP client or probe command to run one with.
    # Nothing waits on the Collector, and an exporter that cannot send to it drops what it holds.

  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
    ports:
      # Its alerts page, on the loopback interface (plan 7, Q4).
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
    # The image declares /prometheus a volume; a tmpfs there, owned by the image's user (nobody,
    # 65534), keeps Docker from creating an anonymous one. A restart of Prometheus loses its history
    # (the user's decision of 2026-11-15).
    tmpfs:
      - /prometheus:uid=65534,gid=65534
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  tempo:
    restart: unless-stopped
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    # Not published: the Collector writes to it and Grafana reads it on the compose network.
    volumes:
      - ./deploy/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    healthcheck:
      # The image has no shell or HTTP client: Tempo's own binary probes its /ready.
      test: ["CMD", "/tempo", "-health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  loki:
    restart: unless-stopped
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    command: ["-config.file=/etc/loki/loki.yaml"]
    # Not published: the Collector writes to it and Grafana reads it on the compose network.
    volumes:
      - ./deploy/loki/loki.yaml:/etc/loki/loki.yaml:ro
    healthcheck:
      # The image has no shell or HTTP client: Loki's own binary probes its /ready.
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  grafana:
    restart: unless-stopped
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    ports:
      # Loopback only; 3000 is the dashboard (plan 7, Q4).
      - "127.0.0.1:3001:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      # The team reads the dashboards and alerts without an account, as anonymous Viewers (spec 6.6,
      # the user's decision of 2026-11-15).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Opens Explore to Viewers, where a log line jumps to its trace; they may change a panel on
      # screen but never save it (plan 7, Q1-A). Deprecated by Grafana, still honoured by 13.3.
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      # Explore's query history is off: it was the one thing a Viewer could save, and every
      # anonymous visitor shared it (the user's decision of 2026-11-15).
      GF_QUERY_HISTORY_ENABLED: "false"
      # No Grafana account is committed (spec 6.6): the built-in administrator cannot sign in.
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # No anonymous usage statistics to Grafana Labs (the user's decision of 2026-11-15).
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Nor checks grafana.com for new versions of Grafana or its plugins (the user's decision of
      # 2026-11-15).
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"

volumes:
  postgres-data:
