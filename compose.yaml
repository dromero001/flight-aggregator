# Runs the three mock providers, PostgreSQL and the aggregator: docker compose up --build
# The keys and the database password below are demo defaults, committed on purpose so that the
# project runs with that single command (spec 6.6). They protect only these local containers, whose
# ports are bound to the loopback interface. Override any of them from the shell or a .env file:
# ALPHA_API_KEY, BETA_API_KEY, GAMMA_API_KEY, POSTGRES_PASSWORD, ADMIN_SERVICE_CLIENT_SECRET.
# The same holds for the secret of the admin-service client in the imported Keycloak realm
# (deploy/keycloak/flight-aggregator-realm.json) and for the demo passwords of Keycloak's own
# administrator and of the realm's admin user: committed on purpose so that a reviewer can call the
# admin endpoints without the author (README, "Admin access"). In production they would be secrets.
services:
  postgres:
    # Every service comes back after a crash or a Docker restart, until it is stopped on purpose.
    restart: unless-stopped
    image: postgres:18.4-trixie@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    environment:
      POSTGRES_DB: flightaggregator
      POSTGRES_USER: flightaggregator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-postgres-password}
    # Not published: only the app, on the compose network, reaches the database.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flightaggregator -d flightaggregator"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    restart: unless-stopped
    build:
      context: .
      dockerfile: bootstrap/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mock-gds:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # 512 MB of heap: the ingestion streams its ~1M itineraries into COPY, never holding them (R4).
      JAVA_TOOL_OPTIONS: -Xmx512m
      # The driver's socketTimeout (120 s) and tcpKeepAlive come from application.yaml, for any URL.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flightaggregator
      SPRING_DATASOURCE_USERNAME: flightaggregator
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-demo-postgres-password}
      PROVIDERS_ALPHA_BASEURL: http://mock-gds:8080
      PROVIDERS_ALPHA_APIKEY: ${ALPHA_API_KEY:-demo-alpha-key}
      PROVIDERS_BETA_BASEURL: http://mock-gds:8080
      PROVIDERS_BETA_APIKEY: ${BETA_API_KEY:-demo-beta-key}
      PROVIDERS_GAMMA_BASEURL: http://mock-gds:8080
      PROVIDERS_GAMMA_APIKEY: ${GAMMA_API_KEY:-demo-gamma-key}
      # The signatures are checked against Keycloak on the compose network; the issuer is its public
      # name (the issuer-uri of application.yaml stays http://localhost:8180/realms/flight-aggregator).
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8080/realms/flight-aggregator/protocol/openid-connect/certs
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/8080
          && printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          && grep -q '"status":"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    restart: unless-stopped
    build:
      context: frontend
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      # nginx serves the dashboard and proxies /api to the app, so the browser sees one origin.
      API_UPSTREAM: http://app:8080
      # Served as /config.json for the admin sign-in: the address a browser reaches Keycloak by.
      OIDC_AUTHORITY: http://localhost:8180/realms/flight-aggregator
      OIDC_CLIENT_ID: dashboard
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  keycloak:
    restart: unless-stopped
    image: quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
    command: ["start-dev", "--import-realm"]
    environment:
      # The issuer of every token: the address a browser reaches Keycloak by, not the one the app uses.
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
      # Read by the realm file's ${ADMIN_SERVICE_CLIENT_SECRET:...} placeholder at import.
      ADMIN_SERVICE_CLIENT_SECRET: ${ADMIN_SERVICE_CLIENT_SECRET:-demo-admin-service-secret}
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./deploy/keycloak/flight-aggregator-realm.json:/opt/keycloak/data/import/flight-aggregator-realm.json:ro
    healthcheck:
      # The image has no curl: read the readiness answer of the management port over a TCP socket.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/9000
          && printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          && grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  mock-gds:
    restart: unless-stopped
    build:
      context: .
      dockerfile: mock-gds/Dockerfile
    ports:
      # Loopback only: the demo keys are public, so the mock is not published on the network.
      - "127.0.0.1:8081:8080"
    environment:
      MOCKGDS_PROVIDERS_ALPHA_APIKEY: ${ALPHA_API_KEY:-demo-alpha-key}
      MOCKGDS_PROVIDERS_BETA_APIKEY: ${BETA_API_KEY:-demo-beta-key}
      MOCKGDS_PROVIDERS_GAMMA_APIKEY: ${GAMMA_API_KEY:-demo-gamma-key}
    healthcheck:
      # The JRE image has no curl or wget: read the health response over a plain TCP socket with bash.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/8080
          && printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          && grep -q '"status":"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
