[versions]
junit = "6.1.3"
assertj = "3.27.7"
spotless = "8.10.4"
google-java-format = "1.36.1"
archunit = "1.5.1"
spring-boot = "4.1.2"
jacoco = "0.8.16"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
# Tool versions read by the build logic, declared as libraries so that Dependabot sees them.
google-java-format = { module = "com.google.googlejavaformat:google-java-format", version.ref = "google-java-format" }
jacoco-agent = { module = "org.jacoco:org.jacoco.agent", version.ref = "jacoco" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-context = { module = "org.springframework:spring-context" }
