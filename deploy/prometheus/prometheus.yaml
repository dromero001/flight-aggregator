# Prometheus in compose (spec 6.10): it scrapes the application and evaluates the alert rules, with
# no notification channel; the alerts are read on its alerts page and in Grafana.
global:
  # Panels and alerts react within a minute (plan 7, Q4).
  scrape_interval: 15s
  evaluation_interval: 15s

# Relative to this file: deploy/prometheus/rules/ in the repository. Only *.rules.yaml: promtool's
# unit tests for them (*.rules.test.yaml) sit beside them and are not rule files.
rule_files:
  - rules/*.rules.yaml

scrape_configs:
  # The app's metrics, on its management port, which only compose's network reaches; no token (spec
  # 6.6). Compose's DNS answers the service name with every replica, so each is a target with its
  # own instance label, which the rules combine (plan 7, "Decisions").
  - job_name: app
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [app]
        type: A
        port: 8079
