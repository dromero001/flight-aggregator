# Tempo in compose (spec 6.10): a single process that receives the traces from the Collector over
# OTLP and keeps them on the container's own disk, so they last while the container does (plan 7,
# Q4: no volume). The image runs as a non-root user that may write only under /tmp.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks

# No anonymous usage report to Grafana Labs (the user's decision of 2026-11-15).
usage_report:
  reporting_enabled: false
