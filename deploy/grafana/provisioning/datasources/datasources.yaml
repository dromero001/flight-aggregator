# The three signals in one Grafana (spec 6.10), provisioned from this file and read-only in the UI.
# The fixed uids are what the dashboard and the links between signals refer to.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    editable: false

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # The jump from a log line to its trace (spec 6.10): each record's trace id is the structured
      # metadata trace_id (never a label, plan 7 Global Constraints), and opens in Tempo.
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          # The trace's query is the matched value; $$ keeps provisioning from reading it as an
          # environment variable (it would become empty).
          url: "$${__value.raw}"
          urlDisplayLabel: View trace
