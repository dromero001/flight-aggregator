name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push cancels the run still going on the same branch, main included (the user's decision
# of 2026-11-16): the newest commit's run covers every earlier one, and parallel runs on main had
# Maven Central answer 429 to the e2e job's image builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew build
      # cancelled() too: a job that hits timeout-minutes is cancelled, and its reports matter most.
      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-reports
          path: |
            **/build/reports/
            **/build/test-results/

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Builds the images to prove the Dockerfiles work; nothing is pushed.
      - run: docker build -f mock-gds/Dockerfile .
      - run: docker build -f bootstrap/Dockerfile .
      - run: docker build -t frontend-image frontend
      # The image refuses an unsafe configuration and serves a good one.
      - run: frontend/nginx/test-config-validation.sh frontend-image

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Spec 6.11 step 3, the types' half: src/api/schema.d.ts must be what openapi-typescript
      # generates from the committed contract; the backend job's OpenApiContractTest is the other
      # half (the committed contract is the one the app serves). Before verify, whose Vitest run
      # includes the same test: on drift this step fails by name, and verify does not run.
      - name: Contract drift
        run: npm run api:check
      # Typecheck (strict), ESLint, Prettier and Vitest, in that order (spec 6.11).
      - run: npm run verify
      # cancelled() too: a job that hits timeout-minutes is cancelled, and its reports matter most.
      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-reports
          path: frontend/test-results/

  # Spec 6.11 step 5: Playwright with axe against the whole stack, started as a reviewer starts it.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Every service healthy before the first test; the specs' global setup then waits for the
      # first ingestion to publish.
      - name: Start the stack
        working-directory: .
        run: docker compose up --build -d --wait
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run e2e
      # cancelled() too: a job that hits timeout-minutes is cancelled, and its reports matter most.
      - if: failure() || cancelled()
        working-directory: .
        run: docker compose logs --no-color > compose-logs.txt
      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports
          path: |
            frontend/playwright-report/
            frontend/test-results/
            compose-logs.txt
      - if: always()
        working-directory: .
        run: docker compose down -v
